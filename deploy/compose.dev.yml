# Local development infrastructure only. Production uses deploy/quadlets.
#   podman compose -f deploy/compose.dev.yml up -d
name: provisia-dev

services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: provisia
      POSTGRES_PASSWORD: provisia
      POSTGRES_DB: provisia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./dev/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provisia -d provisia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: docker.io/valkey/valkey:8
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  postgres-data:
  redis-data:
