packages:
  - apps/*
  - packages/*

# Native/postinstall packages allowed to run build scripts (pnpm 12 blocks all others).
allowBuilds:
  "@biomejs/biome": true
  "@tailwindcss/oxide": true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.9"
  - "@turbo/darwin-arm64@2.11.9"
  - "@turbo/linux-64@2.11.9"
  - "@turbo/linux-arm64@2.11.9"
  - "@turbo/windows-64@2.11.9"
  - "@turbo/windows-arm64@2.11.9"
  - turbo@2.11.9
  - bullmq@6.3.16
  - lucide-react@1.58.0

# Hoist every dependency to the root node_modules (see .npmrc for why). pnpm 12 reads this file, not .npmrc, for this setting.
shamefullyHoist: true
